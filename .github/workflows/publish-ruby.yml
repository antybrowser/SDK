name: Publish to RubyGems

on:
  push:
    tags: ['sdk-ruby/v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build
        working-directory: ruby
        run: gem build antybrowser.gemspec

      - name: Publish
        working-directory: ruby
        run: gem push antybrowser-*.gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
